android.enableJetifier=false
android.useAndroidX=true
kotlin.code.style=official
org.gradle.configuration-cache=true
# Plain console output (rich console buffers ANSI sequences and never flushes
# when stdout is not a TTY — this breaks any tool that captures gradle output
# to a file or pipe, including CI agents). Forces deterministic plain output
# across all invocations.
org.gradle.console=plain
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
