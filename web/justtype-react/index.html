<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>JustType keyboard demo</title>
		<style>
			body { margin: 0; font-family: system-ui, sans-serif; background: #e9ebef; }
			@media (prefers-color-scheme: dark) { body { background: #0b0d10; color: #f0f2f5; } }
			main { max-width: 760px; margin: 0 auto; padding: 16px; }
			.controls { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; margin-bottom: 12px; }
			.controls select { font: inherit; padding: 4px 8px; }
			.hint { font-size: 0.9rem; opacity: 0.75; margin: 8px 0 0; }
		</style>
	</head>
	<body>
		<main id="root"></main>
		<script type="module" src="/demo/main.tsx"></script>
	</body>
</html>
