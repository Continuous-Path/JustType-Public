          <path class="thin accent" d="M36 6 V13 M36 48 V37 M11 25 H24 M61 25 H48"></path>
          <path class="fill accent-fill" d="M36 -7 L28 6 H44 Z M36 55 L43 42 H29 Z M6 25 L19 18 V32 Z M66 25 L53 32 V18 Z"></path>
        </svg>
