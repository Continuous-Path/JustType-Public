<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 72 72">
  <title>Drag Mode</title>
  <style>:root {
  --line: #17212b;
  --accent: #006d77;
  --transform: #c2410c;
}
.stroke {
  fill: none;
  stroke: var(--line);
  stroke-width: 5;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.thin {
  fill: none;
  stroke: var(--line);
  stroke-width: 3.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.clock {
  fill: none;
  stroke: var(--line);
  stroke-width: 7;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.fill {
  fill: var(--line);
}
.soft {
  fill: #e5e9ee;
  stroke: #8b98a5;
  stroke-width: 2.8;
}
.ghost {
  fill: #eef1f4;
  stroke: #a6b0ba;
  stroke-width: 3;
  opacity: 0.65;
}
.accent {
  stroke: var(--accent);
}
.accent-fill {
  fill: var(--accent);
}
.transform {
  stroke: var(--transform);
}
.transform-fill {
  fill: var(--transform);
}
.gridline {
  fill: none;
  stroke: var(--line);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.gridline-accent {
  fill: none;
  stroke: var(--accent);
  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mini-text {
  font-size: 15px;
  font-weight: 800;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  fill: var(--line);
  text-anchor: middle;
}
.tiny-text {
  font-size: 11px;
  font-weight: 800;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  fill: var(--line);
  text-anchor: middle;
}
.tiny-text.accent-fill {
  fill: var(--accent);
}
</style>
          <rect class="thin" x="8" y="10" width="24" height="24" rx="3"></rect>
          <path class="gridline" d="M16 10 V34 M24 10 V34 M8 18 H32 M8 26 H32"></path>
          <rect class="soft" x="41" y="18" width="10" height="10" rx="2"></rect>
          <path class="thin accent" d="M51 23 H62"></path>
          <path class="fill accent-fill" d="M66 23 L58 18 V28 Z"></path>
        </svg>
