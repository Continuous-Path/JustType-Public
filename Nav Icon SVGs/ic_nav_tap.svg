  stroke-width: 2.2;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.mini-text {
  font-size: 15px;
  font-weight: 800;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  fill: var(--line);
  text-anchor: middle;
}
.tiny-text {
  font-size: 11px;
  font-weight: 800;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  fill: var(--line);
  text-anchor: middle;
}
.tiny-text.accent-fill {
  fill: var(--accent);
}
</style>
