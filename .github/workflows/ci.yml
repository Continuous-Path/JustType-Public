name: CI

on:
  push:
    tags: ['v*']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Quota (free plan): CI runs only when a release tag is cut (alongside the Release
# workflow). Everyday commits are gated locally (jt check stamp + commit/push hooks).
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew assembleDebug

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew lintDebug

  # tests + detekt + spotless + coverage in one invocation (mirrors ./jt check-full
  # minus lint): shared compile and daemon instead of three separate runner spin-ups.
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - run: ./gradlew -Pcoverage :app:testDebugUnitTest detekt spotlessCheck :app:jacocoTestReport
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            app/build/test-results/**
            app/build/reports/tests/**
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: app/build/reports/jacoco/**
          if-no-files-found: ignore
          retention-days: 14
