name: Release

# Builds a signed release APK and publishes it to the public downloads repo
# (Continuous-Path/JustType-Releases) so the website's download link always
# serves the newest build. Triggers: push a `v*` tag, or run manually from
# the Actions tab. Setup + secrets reference: docs/release.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: true

      - name: Decode signing keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.JUSTTYPE_KEYSTORE_BASE64 }}
        run: |
          if [[ -z "$KEYSTORE_BASE64" ]]; then
            echo '::error::JUSTTYPE_KEYSTORE_BASE64 secret is not set (see docs/release.md)'
            exit 1
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/justtype-release.jks"

      - name: Build signed release APK
        env:
          ORG_GRADLE_PROJECT_JUSTTYPE_KEYSTORE_FILE: ${{ runner.temp }}/justtype-release.jks
          ORG_GRADLE_PROJECT_JUSTTYPE_KEYSTORE_PASSWORD: ${{ secrets.JUSTTYPE_KEYSTORE_PASSWORD }}
          ORG_GRADLE_PROJECT_JUSTTYPE_KEY_PASSWORD: ${{ secrets.JUSTTYPE_KEYSTORE_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Refuse to publish a debug-signed APK
        run: |
          APK=app/build/outputs/apk/release/app-release.apk
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)"
          "$APKSIGNER" verify --print-certs "$APK" | tee /tmp/certs.txt
          if grep -q 'CN=Android Debug' /tmp/certs.txt; then
            echo '::error::build fell back to the DEBUG key — check the signing secrets'
            exit 1
          fi

      - name: Publish to Continuous-Path/JustType-Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG="$GITHUB_REF_NAME"
          else
            # Manual runs: derive a unique tag from versionName + run number.
            VERSION="$(sed -n "s/^[[:space:]]*versionName '\(.*\)'/\1/p" app/build.gradle)"
            TAG="v${VERSION}-build${GITHUB_RUN_NUMBER}"
          fi
          cp app/build/outputs/apk/release/app-release.apk "justtype-${TAG}.apk"
          cp app/build/outputs/apk/release/app-release.apk justtype.apk
          # justtype.apk on every release keeps the stable website link working:
          # https://github.com/Continuous-Path/JustType-Releases/releases/latest/download/justtype.apk
          gh release create "$TAG" \
            --repo Continuous-Path/JustType-Releases \
            --title "JustType $TAG" \
            --notes "Signed JustType release build ($TAG)." \
            "justtype-${TAG}.apk" justtype.apk \
          || gh release upload "$TAG" \
            --repo Continuous-Path/JustType-Releases \
            --clobber "justtype-${TAG}.apk" justtype.apk
